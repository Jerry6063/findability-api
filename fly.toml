# findability-api on Fly.io — scale-to-zero, single machine, no secrets here.
#
# Secrets (GEMINI_API_KEY, ANTHROPIC_API_KEY) are set with `fly secrets set` and
# live in Fly's encrypted store. Nothing in this file is confidential.

app = "findability-api"
primary_region = "ewr"          # Newark: closest region to the site's author/audience

[build]
  dockerfile = "Dockerfile"

[env]
  # Enabled after testing it against the live app, not after reading the docs —
  # Fly documents what Fly-Client-IP *means* but never says a client-supplied
  # copy is replaced, and it knowingly passes a client-set X-Forwarded-Port
  # through, so the docs could not settle this.
  #
  # Measured 2026-08-10 against findability-api.fly.dev with the limiter at 3/min:
  # three requests exhausted the bucket, then three different forged
  # Fly-Client-IP values (203.0.113.7, 198.51.100.42, 192.0.2.99) each got 429
  # and /health still reported tracked_clients=1. A forged value mints no bucket.
  # Either Fly overwrites the header or client_ip()'s rightmost-entry parsing
  # neutralises it; both give the same guarantee, and the rightmost parsing is
  # what makes the second case safe. Re-run that check if this ever moves off Fly.
  FINDABILITY_CLIENT_IP_HEADER = "fly-client-ip"

  # Per visitor, now that buckets really are per visitor. The code default of 10
  # is too tight for one browsing human: /search is debounced at 700ms and fires
  # again on Enter, /related fires per modal, and arrival costs up to three
  # /health probes, so an engaged visitor can spend 15-20 requests in a minute
  # without doing anything unusual.
  #
  # 30 leaves that room while still bounding one client's burst. It is not the
  # spend control — the daily budgets are (150 ask, 5000 search) — it is what
  # stops a single caller monopolising one small machine or draining a day's
  # budget in seconds.
  FINDABILITY_RATE_LIMIT = "30"

[http_service]
  # The Dockerfile's CMD binds ${PORT:-8200} and Fly does NOT inject PORT, so the
  # container really listens on 8200. This must stay in sync with that CMD.
  internal_port = 8200
  force_https = true

  # Scale to zero between visits. This is a portfolio widget: idle most of the day.
  #
  # auto_stop_machines is a STRING ("off" | "stop" | "suspend"), not a boolean —
  # the boolean form is legacy. "suspend" snapshots RAM so a wake skips the
  # Python + chromadb import cost, which dominates cold start here.
  #   https://fly.io/docs/reference/configuration/#the-http_service-section
  #   https://fly.io/docs/launch/autostop-autostart/
  # Suspension is only eligible up to 2 GiB of RAM; this VM is 512 MB, so it
  # qualifies. If it ever becomes ineligible Fly falls back to autostop, which is
  # still correct — just a slower wake.
  #   https://community.fly.io/t/autosuspend-is-here-machine-suspension-is-enabled-everywhere/20942
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

# Keep this app at ONE machine. The /ask daily budget counter is a file on the
# machine's own filesystem, so N machines would mean N independent budgets and
# an N-times-larger daily bill. The counter file survives suspend/stop cycles of
# a given machine; a fresh `fly deploy` replaces the rootfs and resets it, which
# is an accepted (and rare, human-initiated) reset.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
